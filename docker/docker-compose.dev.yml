services:
  ingress:
    image: nginx:alpine
    container_name: janusrp-ingress-dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.ingress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - server
      - adminer

  postgres:
    image: pgvector/pgvector:pg16
    container_name: janusrp-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: janusrp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d janusrp"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: janusrp-adminer-dev
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  server:
    container_name: janusrp-server-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/janusrp
      PORT: 3000
      HOST: 0.0.0.0
      RUST_LOG: info,janus_server=debug
    volumes:
      - ../Cargo.toml:/app/Cargo.toml
      - ../Cargo.lock:/app/Cargo.lock
      - ../crates:/app/crates
      - cargo_registry_cache:/usr/local/cargo/registry
      - cargo_target_cache:/app/target
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: janusrp-frontend-dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - server

volumes:
  postgres_dev_data:
    driver: local
  cargo_registry_cache:
    driver: local
  cargo_target_cache:
    driver: local
