services:
  ingress:
    image: nginx:alpine
    container_name: janusrp-ingress
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.ingress.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - server
      - adminer

  postgres:
    image: pgvector/pgvector:pg16
    container_name: janusrp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: janusrp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d janusrp"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: janusrp-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  server:
    container_name: janusrp-server
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/janusrp
      PORT: 3000
      HOST: 0.0.0.0
      RUST_LOG: info,janus_server=info
      GLIMMER_BASE_URL: http://host.docker.internal:8080/v1
      GLIMMER_MODEL: mlx/Muse-Glimmer-30B-JANG_6M-CRACK
      QWEN_BASE_URL: http://host.docker.internal:8080/v1
      QWEN_MODEL: mlx/Qwen3.8-27B-8bit
      LLM_TIMEOUT_SECONDS: "120"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: janusrp-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
